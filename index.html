<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#262e60">
<meta name="color-scheme" content="light dark">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>面板</title>
<style>
  :root{color-scheme:light;--bg:#f4f5fa;--fg:#242641;--mut:#6b6e83;--card:#fff;--field:#f8f9fc;
    --line:#dfe1ec;--acc:#5146a5;--hover:#43388f;--soft:#f0eefb;--err:#b33145;--glow:#dedaf6;
    --shadow:0 24px 80px -32px #30345630,0 4px 16px -8px #30345612}
  @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#11121d;--fg:#f0eff8;--mut:#a7a8bd;
    --card:#1c1d2d;--field:#161724;--line:#38394d;--acc:#b8adff;--hover:#c9c0ff;--soft:#2c2844;
    --err:#ff9cae;--glow:#292044;--shadow:0 24px 80px -32px #0009}}
  *{box-sizing:border-box}
  html{min-height:100%;background:var(--bg)}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
    background:radial-gradient(ellipse at 50% 38%,var(--glow),transparent 62%),var(--bg);
    padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-right:max(24px,env(safe-area-inset-right));
    padding-bottom:max(24px,env(safe-area-inset-bottom));padding-left:max(24px,env(safe-area-inset-left))}
  button,input{font:inherit}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
  .site-header{width:100%;max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:.02em}
  .brand img{display:block;border-radius:10px}
  .header-note{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:7px}
  .status-dot{height:6px;width:6px;background:var(--acc);border-radius:50%}
  .stage{width:100%;flex:1;display:flex;align-items:center;justify-content:center;padding:48px 0}
  .box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;
    padding:38px;box-shadow:var(--shadow)}
  .welcome-icon{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;
    background:var(--soft);color:var(--acc);margin-bottom:24px}
  svg{display:block;flex-shrink:0}
  .eyebrow{margin:0 0 8px;font-size:11px;font-weight:650;letter-spacing:.15em;color:var(--mut)}
  h1{margin:0;font-size:30px;line-height:1.35;letter-spacing:-.04em;font-weight:650}
  .sub{margin:12px 0 28px;color:var(--mut);font-size:14px}
  .field-label{display:block;margin-bottom:8px;font-size:13px;font-weight:600}
  .password-field{position:relative}
  #pw{display:block;width:100%;height:54px;padding:13px 56px 13px 15px;border:1px solid var(--line);
    border-radius:12px;background:var(--field);color:var(--fg);font-size:16px;line-height:1.5;-webkit-appearance:none;
    transition:border-color .15s,box-shadow .15s}
  #pw::placeholder{color:var(--mut);opacity:1;font-size:14px}
  #pw:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
  #pw[aria-invalid=true]{border-color:var(--err)}
  .toggle{position:absolute;right:4px;top:5px;display:flex;align-items:center;justify-content:center;
    width:44px;height:44px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--mut);cursor:pointer}
  .toggle:hover{background:var(--soft);color:var(--acc)}
  .toggle[aria-pressed=true]{color:var(--acc);background:var(--soft)}
  .caps{font-size:12px;color:var(--mut);margin:8px 0 0}
  .rm{display:flex;align-items:center;gap:10px;min-height:44px;margin:12px 0 14px;font-size:13px;cursor:pointer}
  .rm input{flex-shrink:0;width:18px;height:18px;margin:0;accent-color:var(--acc);cursor:pointer}
  .rm small{display:block;color:var(--mut);font-size:11px;line-height:1.5;margin-top:1px}
  .submit{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:13px 18px;
    border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
    transition:background .15s,transform .15s}
  .submit:hover{background:var(--hover)}
  .submit:active{transform:translateY(1px)}
  .submit:disabled{cursor:wait;opacity:.75;transform:none}
  .toggle:disabled{cursor:default;opacity:.5}
  .spinner{display:none;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:spin .8s linear infinite}
  [aria-busy=true] .spinner{display:block}
  [aria-busy=true] .arrow{display:none}
  .msg{font-size:13px;min-height:22px;margin-top:12px;overflow-wrap:anywhere}
  .msg.err{color:var(--err)}
  .msg.wait{color:var(--mut)}
  .privacy{display:flex;align-items:center;justify-content:center;gap:7px;border-top:1px solid var(--line);
    padding-top:20px;margin:20px 0 0;color:var(--mut);font-size:12px}
  .site-footer{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.02em}
  noscript p{font-size:13px;color:var(--err)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-color-scheme:dark){.submit{color:#1a1530}}
  @media(max-width:480px){body{padding:20px;padding-top:max(20px,env(safe-area-inset-top));
    padding-right:max(20px,env(safe-area-inset-right));padding-bottom:max(20px,env(safe-area-inset-bottom));
    padding-left:max(20px,env(safe-area-inset-left))}.stage{padding:32px 0}.box{padding:28px 24px;border-radius:20px}
    h1{font-size:28px}.header-note{font-size:11px}.welcome-icon{margin-bottom:20px}}
  @media(max-width:350px){body{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
    .box{padding:24px 20px}.header-note{display:none}}
  @media(max-height:650px){.stage{padding:24px 0}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-header">
  <div class="brand"><img src="icon-192.png" width="32" height="32" alt=""> 面板</div>
  <span class="header-note"><span class="status-dot" aria-hidden="true"></span> 内容已加密</span>
</header>
<main class="stage">
  <section class="box" aria-labelledby="welcome">
    <div class="welcome-icon" aria-hidden="true">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
    </div>
    <p class="eyebrow">P / BOARD</p>
    <h1 id="welcome">欢迎回来</h1>
    <p class="sub">输入口令，打开你的专属面板。</p>
    <form id="f" novalidate aria-busy="false">
      <label class="field-label" for="pw">访问口令</label>
      <div class="password-field">
        <input id="pw" type="password" inputmode="text" autocomplete="current-password" enterkeyhint="go"
          placeholder="请输入口令" spellcheck="false" autocapitalize="none" autocorrect="off" required aria-describedby="msg caps">
        <button id="toggle-pw" class="toggle" type="button" aria-label="显示口令" aria-controls="pw" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p id="caps" class="caps" aria-live="polite" hidden>大写锁定已开启</p>
      <label class="rm" for="rm"><input id="rm" type="checkbox"><span>在这台设备上记住<small>口令仅存本机，请在个人设备上使用</small></span></label>
      <button id="go" class="submit" type="submit">
        <span class="spinner" aria-hidden="true"></span><span id="go-label">解锁面板</span>
        <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
      </button>
      <div id="msg" class="msg" role="status" aria-live="polite" aria-atomic="true"></div>
    </form>
    <noscript><p>请启用浏览器的 JavaScript 后解锁面板。</p></noscript>
    <p class="privacy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-5"/></svg>内容在本机解密</p>
  </section>
</main>
<footer class="site-footer">你的面板 · 你的空间</footer>

  var KEY = "lk_dash_v1";
  var $ = function(id){ return document.getElementById(id); };
  var busy = false;
  var supported = true;

  function say(t, cls){ $("msg").textContent = t; $("msg").className = "msg" + (cls ? " " + cls : ""); }
  function setBusy(value){
    busy = value;
    $("f").setAttribute("aria-busy", String(value));
    $("go").disabled = value || !supported;
    $("go-label").textContent = value ? "正在解锁…" : "解锁面板";
    $("pw").readOnly = value;
    $("rm").disabled = value;
    $("toggle-pw").disabled = value;
  }

  function b64(s){
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  if (!(window.crypto && window.crypto.subtle)) {
    say("这个浏览器不支持解密所需的 WebCrypto（需用 HTTPS 打开）。", "err");
    supported = false;
  } else if (P.gz && typeof DecompressionStream === "undefined") {
    say("浏览器不支持内容解压，请更新浏览器后再试。", "err");
    supported = false;
  }
  $("go").disabled = !supported;

  async function gunzip(buf){
    if (typeof DecompressionStream === "undefined")
      throw new Error("浏览器太旧，不支持 gzip 解压（iOS 需 16.4 以上）");
    var stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unlock(pw, fromStore){
    if (busy || !supported) return;
    var remember = $("rm").checked;
    var stage = "key";
    say(fromStore ? "正在使用本机保存的口令…" : "正在解锁，请稍候…", "wait");
    $("pw").removeAttribute("aria-invalid");
    setBusy(true);
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
                                               "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(P.salt), iterations: P.it, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      stage = "decrypt";
      var plain = new Uint8Array(await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(P.nonce) }, key, b64(P.ct)));
      stage = "content";
      if (P.gz) plain = await gunzip(plain);
      var doc = new TextDecoder("utf-8").decode(plain);

      try {
        if (remember) localStorage.setItem(KEY, pw);
        else localStorage.removeItem(KEY);
      } catch(e){}

      $("pw").value = "";
      stage = "render";
      document.open(); document.write(doc); document.close();
    } catch (e) {
      // 只有解密认证失败才清除旧口令；浏览器或解压问题不应丢掉记忆。
      var authFailure = stage === "decrypt" && e && e.name === "OperationError";
      if (fromStore && authFailure) {
        try { localStorage.removeItem(KEY); } catch(_){}
        $("rm").checked = false;
        say("已保存的口令已失效，请重新输入。", "wait");
      } else if (authFailure) {
        say("口令不正确，或内容已更新，请重试。", "err");
        $("pw").setAttribute("aria-invalid", "true");
      } else {
        say("暂时无法打开内容，请刷新页面或更新浏览器后重试。", "err");
      }
      setBusy(false);
      // 保留手动输入，长口令输错一位时可以直接修正。
      if (!fromStore) $("pw").focus();
    }
  }

  $("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (busy || !supported) return;
    var pw = $("pw").value;
    if (!pw) {
      say("请先输入访问口令。", "err");
      $("pw").setAttribute("aria-invalid", "true");
      $("pw").focus();
      return;
    }
    unlock(pw, false);
  });
  $("toggle-pw").addEventListener("click", function(){
    var show = $("pw").type === "password";
    $("pw").type = show ? "text" : "password";
    this.setAttribute("aria-pressed", String(show));
    this.setAttribute("aria-label", show ? "隐藏口令" : "显示口令");
  });
  $("pw").addEventListener("input", function(){
    if (!busy && supported) { $("pw").removeAttribute("aria-invalid"); say(""); }
  });
  function capsLock(ev){
    $("caps").hidden = !(ev.getModifierState && ev.getModifierState("CapsLock"));
  }
  $("pw").addEventListener("keydown", capsLock);
  $("pw").addEventListener("keyup", capsLock);
  $("pw").addEventListener("blur", function(){ $("caps").hidden = true; });
  $("rm").addEventListener("change", function(){
    if (!this.checked) { try { localStorage.removeItem(KEY); } catch(e){} }
  });

  var saved = null;
  if (supported) { try { saved = localStorage.getItem(KEY); } catch(e){} }
  if (saved) { $("rm").checked = true; unlock(saved, true); }
  else if (supported && window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
    $("pw").focus();
  }
})();
