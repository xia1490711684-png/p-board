<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>面板</title>
<style>
  :root{--bg:#f6f7f9;--fg:#1b1d21;--mut:#6b7280;--card:#fff;--line:#e3e6ea;--acc:#2563eb;--err:#b91c1c}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed;--mut:#9aa1ab;--card:#171a20;--line:#272b33;--acc:#60a5fa;--err:#f87171}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:16px}
  .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{margin:0 0 4px;font-size:17px;font-weight:650}
  p.sub{margin:0 0 18px;color:var(--mut);font-size:13px}
  input[type=password]{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:9px;
       background:var(--bg);color:var(--fg);-webkit-appearance:none}
  input[type=password]:focus{outline:none;border-color:var(--acc)}
  button{width:100%;margin-top:12px;padding:11px;font-size:15px;font-weight:600;border:0;border-radius:9px;
       background:var(--acc);color:#fff;cursor:pointer}
  button[disabled]{opacity:.55;cursor:default}
  label.rm{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--mut);font-size:13px;cursor:pointer}
  label.rm input{width:16px;height:16px;accent-color:var(--acc)}
  .msg{margin-top:12px;font-size:13px;min-height:19px}
  .msg.err{color:var(--err)}
  .msg.wait{color:var(--mut)}
</style>
</head>
<body>
<div class="box">
  <h1>面板</h1>
  <p class="sub">内容已加密，请输入口令</p>
  <form id="f">
    <input id="pw" type="password" inputmode="text" autocomplete="current-password"
           placeholder="口令" autofocus spellcheck="false">
    <button id="go" type="submit">解锁</button>
    <label class="rm"><input id="rm" type="checkbox"> 在这台设备上记住（仅存本机）</label>
  </form>
  <div id="msg" class="msg"></div>
</div>

  var KEY = "lk_dash_v1";
  var $ = function(id){ return document.getElementById(id); };

  function say(t, cls){ $("msg").textContent = t; $("msg").className = "msg" + (cls ? " " + cls : ""); }

  function b64(s){
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  if (!(window.crypto && window.crypto.subtle)) {
    say("这个浏览器不支持解密所需的 WebCrypto（需用 HTTPS 打开）。", "err");
    $("go").disabled = true; return;
  }

  async function gunzip(buf){
    if (typeof DecompressionStream === "undefined")
      throw new Error("浏览器太旧，不支持 gzip 解压（iOS 需 16.4 以上）");
    var stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unlock(pw, fromStore){
    say("解密中…", "wait");
    $("go").disabled = true;
    try {
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
                                               "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(P.salt), iterations: P.it, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var plain = new Uint8Array(await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(P.nonce) }, key, b64(P.ct)));
      if (P.gz) plain = await gunzip(plain);
      var doc = new TextDecoder("utf-8").decode(plain);

      if ($("rm").checked) { try { localStorage.setItem(KEY, pw); } catch(e){} }

      document.open(); document.write(doc); document.close();
    } catch (e) {
      var tooOld = /gzip|16\.4|太旧/.test((e && e.message) || "");
      // 自动解锁（记住的口令）失败时**静默**处理：用户什么都没输，
      // 不该看见"口令不对"。这类失败只可能是口令被改过，清掉记忆重来即可。
      if (fromStore) {
        try { localStorage.removeItem(KEY); } catch(_){}
        $("rm").checked = false;
        say(tooOld ? e.message : "", tooOld ? "err" : "");
      } else {
        // AES-GCM 认证失败与口令错误无法区分，一律按口令错处理
        say(tooOld ? e.message : "口令不对", "err");
      }
      $("go").disabled = false;
      $("pw").value = ""; $("pw").focus();
    }
  }

  $("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pw = $("pw").value;
    if (pw) unlock(pw, false);
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved) { $("rm").checked = true; unlock(saved, true); }
})();
